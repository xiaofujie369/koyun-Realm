services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: koyun-controller
    restart: unless-stopped
    env_file: .env.controller
    ports:
      - "127.0.0.1:18890:18890"
    volumes:
      - controller-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18890/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  controller-data:
